# English content. To link a word inside any sentence, write [word](https://address).
# Keep the structure identical to tr.yml:
# same entries in the same order, same number of bullets, same dates and links.
# `npm test` fails if the two files drift apart.

title: Automation Engineer
location: Istanbul, Turkey
description: >-
  Resume of Egecan Şen, an Automation Engineer working on web, iOS and
  Android test automation in Java, and on QA tooling for AI coding agents.

# The About section: a list of highlights. `lead` is an optional line above the list; leave it "" to hide it.
about:
  lead: "Experienced in:"
  highlights:
    - label: Multi-Platform Testing
      text: >-
        Web, iOS and Android test automation in Java with Selenium, Appium and
        JUnit, plus API testing with Retrofit and OkHttp.
    - label: Frameworks and Libraries
      text: >-
        Contributor to the Pickleib test automation libraries on Maven Central;
        built starter frameworks on Page Object Model and BDD with Cucumber.
    - label: QA Processes
      text: >-
        Release approver at citizenM, where I set up a test stage in the
        deployment pipelines and rolled out Xray; proposed and planned the
        Preprod and Hotfix dashboard process at sahibinden.com.
    - label: AI-Assisted QA
      text: >-
        Built Hektor, a skills pack that lets AI coding agents write, diagnose
        and repair tests within a team's review rules.

experience:
  - role: Test Automation Engineer
    company: sahibinden.com
    url: https://www.sahibinden.com
    about: Turkey's largest online classifieds platform.
    start: "2025-09"
    end: null
    bullets:
      - >-
        Responsible for close to 1,000 of the suite's 7,000+ automated tests,
        covering search results and paid listing promotions ("doping").
      - >-
        Started on the iOS test automation team, moved to Android, and now work
        on the web team with Java, Selenium, JUnit, Jenkins and OpenShift.
      - >-
        Came up with Watcher, an internal console that tracks each
        pre-production release across Jenkins jobs and Jira tickets. Built the
        proof of concept, then proposed and planned the Preprod and Hotfix
        dashboard process and documented it with flow diagrams in Confluence.
      - >-
        Built and proposed Hektor, a skills pack that lets AI coding agents
        write and repair tests for the suite within the team's review rules,
        with a separate kit for triaging flaky runs.
      - >-
        Proposed piloting [Achilles](https://www.npmjs.com/package/@civitas-cerebrum/achilles),
        an open-source agentic QA methodology, on the existing Java and
        Selenium stack.
      - >-
        Worked with DevOps to bring an internal test service onto ArgoCD and
        Backstage.

  - role: QA Automation Engineer
    company: citizenM
    url: https://www.citizenm.com/company/overview
    via: contracted through Smart Nearshore
    about: Netherlands-based global hotel chain.
    start: "2023-06"
    end: "2025-08"
    bullets:
      - >-
        Ran website QA through three migrations: the Sunrise database
        migration, including the UI side of its performance tests, the move to
        Nuxt, and the Headless Marketing content migration.
      - >-
        Proposed and set up an automated test stage in the website's deployment
        pipelines, with results posted to a dedicated Slack channel.
      - >-
        Proposed Xray for test management and handled its rollout for the
        website team.
      - >-
        Became one of the website's release approvers and led QA coordination
        for the Black Friday campaign.
      - >-
        Adapted the company's SDLC model for the website and the Contentful
        CMS: defined the test stages and workflows and wrote the documentation
        for both teams.
      - >-
        Co-led the QA team's scrum process, covered mobile app QA during
        staffing gaps, and ran end-to-end QA for the Hotel Service site
        (invoices, bookings, payments).

  - role: Open-Source Contributor
    company: Pickleib and related Java libraries
    about: Java test automation libraries published on Maven Central.
    start: "2022-08"
    end: "2025-04"
    bullets:
      - >-
        Pickleib, a library for web, mobile and API test automation: added
        methods and configuration properties, wrote unit tests and
        documentation, and built the StatusWatcher feature for monitoring test
