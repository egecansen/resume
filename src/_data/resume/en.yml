projects:
  - name: Hektor
    note: 2026, private repository
    text: >-
      Agent skills for a large Selenium and JUnit suite. More than 20 skills,
      six subagent roles and a set of enforcement gates let AI coding agents
      (Cursor) write, diagnose and repair tests without breaking the team's
      review rules. Includes a flaky-triage kit that re-runs failures, groups
      them by root cause and proves each fix green.
  - name: Unified-Automation-Template
    url: https://github.com/egecansen/Unified-Automation-Template
    text: >-
      Starter framework that keeps web, mobile and API test automation in one
      project, built on Pickleib and Cucumber. Supports tag-based runs,
      configurable drivers and headless mode.
  - name: Appium-Springboot-Template
    url: https://github.com/egecansen/Appium-Springboot-Template
    text: >-
      Mobile automation starter with JUnit 5, Appium and Spring Boot. Maven
      multi-module layout and Page Object Model; runs in Jenkins with Docker
      and can email the HTML report.
  - name: Simplified-Automation-Template
    url: https://github.com/egecansen/Simplified-Automation-Template
    text: >-
      Selenium and Cucumber UI tests alongside Retrofit and OkHttp API tests,
      with shared step definitions and page objects that instantiate
      themselves.

